# ===========================================================
# Ski Coach Nginx 生产配置
# 证书绝对路径：/home/ski/ski-coach/deploy/certs
# 路由分发:                                                                                                                                                                                 
#   m.example.com         → ski-mobile-web (用户H5)                                                                                                                                         
#   admin.example.com     → ski-admin-web (管理后台)                                                                                                                                        
#   /api/*  /admin/*      → ski-api-server (Java)                                                                                                                                           
# ===========================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_body_timeout 600s;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    upstream ski_api {
        server ski-api-server:8080;
        keepalive 32;
    }

    # HTTP 自动跳转 HTTPS
    server {
        listen 80;
        server_name m.aiskicoach.cn admin.aiskicoach.cn;
        return 301 https://$host$request_uri;
    }

    # ========== 用户端 H5 ==========
    server {
        listen 443 ssl http2 default_server;
        server_name m.aiskicoach.cn;

        # ✅ 你的真实绝对路径
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;

        root /usr/share/nginx/html/mobile;
        index index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /api/ {
            proxy_pass http://ski_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
		
		# ====================== 视频流高性能配置（新增）======================
		location /api/video_files/ {
			internal;  # 禁止外部访问，必须鉴权
			# 你的视频目录：./data/ski-data → 绝对路径
			alias /data/ski-data/;
			
			# 高性能文件传输配置
			sendfile on;
			tcp_nopush on;
			tcp_nodelay on;
			
			# 支持断点续传和拖动进度条
			add_header Accept-Ranges bytes;
			
			# 视频文件缓存设置（1小时）
			add_header Cache-Control "public, max-age=3600";
			
			# 文件句柄缓存，减少打开/关闭开销
			open_file_cache max=1000 inactive=20s;
			open_file_cache_valid 30s;
			open_file_cache_min_uses 2;
			open_file_cache_errors on;
			
			# 缓冲区优化
			output_buffers 1 128k;
			directio 512k;
			
			# 视频文件类型检测
			types {
				video/mp4 mp4;
				video/quicktime mov;
				video/mp4 m4v;
			}
		}
		# ====================================================================


        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~ /\. { deny all; }
    }

    # ========== 管理后台 ==========
    server {
        listen 443 ssl http2;
        server_name admin.aiskicoach.cn;

        # ✅ 同一套证书，同样绝对路径
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;

        root /usr/share/nginx/html/admin;
        index index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /admin/ {
            proxy_pass http://ski_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~ /\. { deny all; }
    }
}