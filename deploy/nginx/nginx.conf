# ===========================================================
# Ski Coach Nginx 配置
# 路由分发:
#   m.example.com         → ski-mobile-web (用户H5)
#   admin.example.com     → ski-admin-web (管理后台)
#   /api/*  /admin/*      → ski-api-server (Java)
# ===========================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 性能
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip 压缩(前端资源体积减少 60%+)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # 视频上传:最大 100MB(对应业务约束)
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_body_timeout 600s;       # 10分钟,大文件上传可能慢

    # 反代相关
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;        # AI分析最长10分钟
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # ====== Java 后端 upstream ======
    upstream ski_api {
        server ski-api-server:8080;
        keepalive 32;
    }

    # ====== 用户端 H5(默认入口) ======
    server {
        listen 80 default_server;
        server_name _;

        root /usr/share/nginx/html/mobile;
        index index.html;

        # 静态资源缓存 1 年
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # API 转发到 Java 后端
        location /api/ {
            proxy_pass http://ski_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # SPA 路由兜底
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 禁止访问敏感文件
        location ~ /\. {
            deny all;
        }
    }

    # ====== 管理后台(独立子域名) ======
    server {
        listen 80;
        server_name admin.localhost;       # 部署时改成你的实际域名,如 admin.example.com

        root /usr/share/nginx/html/admin;
        index index.html;

        # 限制只有内网/办公IP能访问(可选,提升安全性)
        # allow 192.168.0.0/16;
        # allow 10.0.0.0/8;
        # deny all;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 管理端 API
        location /admin/ {
            proxy_pass http://ski_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~ /\. { deny all; }
    }

    # ====== HTTPS 配置(部署到生产时启用) ======
    # 取消注释,并把证书放到 /etc/nginx/certs/
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name m.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/m.example.com.crt;
    #     ssl_certificate_key /etc/nginx/certs/m.example.com.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_session_cache shared:SSL:10m;
    #
    #     # ... 同上面的 location 配置
    # }
    #
    # # HTTP 自动跳 HTTPS
    # server {
    #     listen 80;
    #     server_name m.example.com admin.example.com;
    #     return 301 https://$host$request_uri;
    # }
}
